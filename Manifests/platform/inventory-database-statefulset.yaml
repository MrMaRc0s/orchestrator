apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-database
spec:
  serviceName: inventory-database-headless
  replicas: 1
  selector:
    matchLabels:
      app: inventory-database
  template:
    metadata:
      labels:
        app: inventory-database
    spec:
      containers:
        - name: postgres
          image: docker.io/cgkaldan/inventory-database:1.0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: INVENTORY_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: INVENTORY_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: INVENTORY_DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: database-files
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-files
          persistentVolumeClaim:
            claimName: inventory-database-pvc

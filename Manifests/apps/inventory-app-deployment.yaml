apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          image: docker.io/cgkaldan/inventory-app:1.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INVENTORY_PORT
              value: "8080"
            - name: INVENTORY_DB_HOST
              value: inventory-database
            - name: INVENTORY_DB_PORT
              value: "5432"
            - name: INVENTORY_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: INVENTORY_DB_NAME
            - name: INVENTORY_DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: INVENTORY_DB_USER
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: INVENTORY_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/movies
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

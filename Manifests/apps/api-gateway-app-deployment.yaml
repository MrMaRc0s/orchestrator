apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
        - name: api-gateway-app
          image: docker.io/cgkaldan/api-gateway-app:1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: INVENTORY_APP_URL
              value: http://inventory-app:8080
            - name: RABBITMQ_HOST
              value: rabbit-queue
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: RABBITMQ_PASSWORD
            - name: BILLING_QUEUE_NAME
              value: billing_queue
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
